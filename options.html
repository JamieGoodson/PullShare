<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PullShare settings</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px 18px;
        min-width: 280px;
        font-size: 13px;
        line-height: 1.5;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      p.hint {
        margin: 0 0 14px;
        opacity: 0.7;
      }
      label.row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
      }
      label.row + label.row {
        margin-top: 12px;
      }
      label.row input {
        margin-top: 2px;
      }
      .row-text strong {
        display: block;
      }
      .row-text span {
        opacity: 0.7;
      }
      #status {
        margin-top: 12px;
        height: 16px;
        color: #1a7f37;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #status.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h1>PullShare</h1>
    <p class="hint">Options for what PullShare copies.</p>

    <label class="row">
      <input type="checkbox" id="showLineCounts" />
      <span class="row-text">
        <strong>Include line counts</strong>
        <span>Append the diffstat, e.g. <em>(+243 / -12)</em>, to the link.</span>
      </span>
    </label>

    <label class="row">
      <input type="checkbox" id="showCopyAsPrompt" />
      <span class="row-text">
        <strong>“Copy as prompt” on review comments</strong>
        <span
          >Add a button to each review thread that copies the comment, file path
          and code lines, ready to paste into Claude.</span
        >
      </span>
    </label>

    <div id="status">Saved</div>

    <script src="options.js"></script>
  </body>
</html>
